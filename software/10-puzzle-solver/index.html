<div class="puzzle">

        <label for="numbers">Numbers</label>
        <input
            id="numbers"
            type="text"
            inputmode="numeric"
            maxlength="4"
            value="1234"
        >
    </div>

    <div class="solver-field">
        <label for="target">Target</label>
        <input
            id="target"
            type="number"
            value="10"
        >
    </div>

    <button id="solve" class="solve-button">

    </button>

</div>
